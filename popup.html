<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 200px; padding: 15px; background: #222; color: #fff; font-family: sans-serif; text-align: center; }
        h3 { margin-top: 0; color: #00ff88; }
        /* CSS cho nút gạt */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ff88; }
        input:checked + .slider:before { transform: translateX(26px); }
        .status-text { margin-top: 10px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <h3>🧰 WASM Hacker</h3>
    <label class="switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="slider"></span>
    </label>
    <div class="status-text" id="statusText">ĐANG TẮT</div>
    <div style="font-size:11px; color:#aaa; margin-top:10px;">(F5 lại trang game để áp dụng)</div>
    
    <script src="popup.js"></script>
</body>
</html>
