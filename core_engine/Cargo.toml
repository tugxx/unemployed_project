[package]
name = "core_engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
egui = "0.27"
console_error_panic_hook = "0.1.7"
lazy_static = "1.5.0"

[dependencies.eframe]
version = "0.27"
default-features = false
features = ["glow", "default_fonts"]

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Window",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "HtmlElement",
  "Element",  
  "Node",
  "console"
]
